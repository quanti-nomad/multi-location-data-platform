name: clinic_platform
version: "1.0.0"
config-version: 2
profile: clinic_platform

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  clinic_platform:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    certified:
      +schema: certified
      +materialized: table
    metrics:
      +schema: metrics
      +materialized: table
